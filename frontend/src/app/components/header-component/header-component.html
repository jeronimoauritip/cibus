<div class="header-wrapper">
  <header class="header">
    <a class="logo" (click)="onLogoClick()" style="cursor: pointer;" aria-label="Cibus, home">
      <img src="cibus-logo.svg" alt="" />
    </a>
    <ng-content select="[headerAction]"></ng-content>
  </header>
  <div class="tray-background" aria-hidden="true">
    <div class="handle"></div>
    <div class="dome"></div>
    <div class="base"></div>
  </div>
  <h1 class="title">
    <ng-content></ng-content>
  </h1>
</div>
