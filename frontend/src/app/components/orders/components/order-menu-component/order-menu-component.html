<div class="menu">
  <input
    type="search"
    class="menu__search"
    placeholder="Search product"
    aria-label="Search product"
    [value]="search()"
    (input)="onSearch($event)"
  />

  <div class="menu__controls">
    <button
      type="button"
      class="menu__pill"
      [class.is-active]="selectedCategory() !== null || openMenu() === 'categories'"
      aria-haspopup="listbox"
      [attr.aria-expanded]="openMenu() === 'categories'"
      (click)="toggleMenu('categories')"
    >
      <span>{{ selectedCategory() ?? 'Categories' }}</span>
      <span class="menu__pill-arrow" [class.is-open]="openMenu() === 'categories'" aria-hidden="true"></span>
    </button>

    <div class="menu__price-anchor">
      <button
        type="button"
        class="menu__pill"
        [class.is-active]="priceSort() !== 'none' || openMenu() === 'price'"
        aria-haspopup="menu"
        [attr.aria-expanded]="openMenu() === 'price'"
        (click)="toggleMenu('price')"
      >
        <span>{{ priceSortLabel() }}</span>
        <span class="menu__pill-arrow" [class.is-open]="openMenu() === 'price'" aria-hidden="true"></span>
      </button>

      @if (openMenu() === 'price') {
        <div class="menu__dropdown menu__dropdown--price" role="menu" aria-label="Sort by price">
          <button
            type="button"
            class="menu__option"
            role="menuitemradio"
            [attr.aria-checked]="priceSort() === 'none'"
            [class.is-selected]="priceSort() === 'none'"
            (click)="selectPriceSort('none')"
          >
            Default order
          </button>
          <button
            type="button"
            class="menu__option"
            role="menuitemradio"
            [attr.aria-checked]="priceSort() === 'asc'"
            [class.is-selected]="priceSort() === 'asc'"
            (click)="selectPriceSort('asc')"
          >
            Price: Low to High
          </button>
          <button
            type="button"
            class="menu__option"
            role="menuitemradio"
            [attr.aria-checked]="priceSort() === 'desc'"
            [class.is-selected]="priceSort() === 'desc'"
            (click)="selectPriceSort('desc')"
          >
            Price: High to Low
          </button>
        </div>
      }
    </div>

    @if (openMenu() === 'categories') {
      <div class="menu__dropdown menu__dropdown--categories" role="listbox" aria-label="Categories">
        <button
          type="button"
          class="menu__option menu__option--pill"
          role="option"
          [attr.aria-selected]="selectedCategory() === null"
          [class.is-selected]="selectedCategory() === null"
          (click)="selectCategory(null)"
        >
          All
        </button>
        @for (category of categories(); track category) {
          <button
            type="button"
            class="menu__option menu__option--pill"
            role="option"
            [attr.aria-selected]="selectedCategory() === category"
            [class.is-selected]="selectedCategory() === category"
            (click)="selectCategory(category)"
          >
            {{ category }}
          </button>
        }
      </div>
    }
  </div>

  @for (group of groupedProducts(); track group.category) {
    <section class="menu__category">
      <h3 class="menu__category-name">{{ group.category }}</h3>
      <ul class="menu__grid">
        @for (product of group.items; track product.id) {
          <li>
            <button
              type="button"
              class="menu__tile"
              [class.is-selected]="!!quantities()[product.id]"
              [disabled]="product.available === false"
              (click)="onAdd(product)"
            >
              @if (quantities()[product.id]; as quantity) {
                <span class="menu__tile-count">{{ quantity }}</span>
              }
              @if (product.available === false) {
                <span class="menu__tile-tag">Sold out</span>
              }
              <span class="menu__tile-name">{{ product.name }}</span>
              @if (product.description) {
                <span class="menu__tile-description">{{ product.description }}</span>
              }
              <span class="menu__tile-price">${{ product.price }}</span>
            </button>
          </li>
        }
      </ul>
    </section>
  } @empty {
    <p class="menu__empty">No products found.</p>
  }
</div>
