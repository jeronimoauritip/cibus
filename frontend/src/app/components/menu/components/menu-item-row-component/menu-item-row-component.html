<article class="product-row" [class.product-row--unavailable]="!menuItem().available">
  <div class="product-row__info">
    <h3 class="product-row__name">
      {{ menuItem().product.name }}
      @if (!menuItem().available) { <span class="badge-inactive">(Inactive)</span> }
    </h3>
    @if (menuItem().product.description) {
      <p class="product-row__description">{{ menuItem().product.description }}</p>
    }
  </div>

  <div class="product-row__actions">
    
    <!-- STATE 1: DELETE CONFIRMATION -->
    @if (confirming()) {
      <span class="product-row__confirm-text">Delete {{ menuItem().product.name }}?</span>
      <button type="button" class="product-row__btn product-row__btn--cancel" (click)="onDeleteCancel()">Cancel</button>
      <button type="button" class="product-row__btn product-row__btn--danger" (click)="onDeleteConfirm()">Delete</button>
    } 
    
    <!-- STATE 2: INLINE EDIT MODE -->
    @else if (isEditing()) {
      <!-- Toggle Switch (Available/Unavailable) -->
      <label class="toggle-switch" title="Toggle product availability">
        <input type="checkbox" [(ngModel)]="draftAvailable" />
        <span class="toggle-slider"></span>
      </label>

      <!-- Price Input -->
      <div class="input-price-wrapper">
        <span class="currency">$</span>
        <input type="number" class="input-price" [(ngModel)]="draftPrice" step="1" min="0" />
      </div>

      <!-- Save Button (Green Check) -->
      <button type="button" class="product-row__btn product-row__btn--icon save-btn" (click)="onSave()" aria-label="Save">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>

      <!-- Delete Button (Red Trash) -->
      <button type="button" class="product-row__btn product-row__btn--icon product-row__btn--delete" (click)="onDeleteRequest()" aria-label="Delete">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>

      <!-- Cancel Button (X) -->
      <button type="button" class="product-row__btn product-row__btn--icon product-row__btn--cancel" (click)="onCancelEdit()" aria-label="Cancel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    } 
    
    <!-- STATE 3: READ MODE (Default) -->
    @else {
      <span class="price-display">${{ menuItem().price }}</span>
      <button type="button" class="product-row__btn product-row__btn--icon" (click)="onEditStart()" aria-label="Edit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
    }
  </div>
</article>
