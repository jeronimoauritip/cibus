<div class="pagina">
  <header class="encabezado">
    <a class="logo" href="/" aria-label="Cibus, home">
      <span class="logo-bandeja" aria-hidden="true"></span>
      <span>cibus</span>
    </a>
  </header>
  <div class="fondo-bandeja" aria-hidden="true">
    <div class="manija"></div>
    <div class="cupula"></div>
  </div>
  <main class="contenido">
    <h1 class="titulo">Menu</h1>
    <label class="buscador">
      <svg class="buscador__icono" viewBox="0 0 28 30" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="8" />
        <path d="M16 17L26 28" />
      </svg>
      <input type="search" name="producto" placeholder="Search product" aria-label="Search product"
  [value]="filter().name"
  (input)="filter.update(f => ({ ...f, name: $any($event.target).value }))" />
    </label>
    <div class="controles">
 <app-product-filter-component [(filter)]="filter" />
</div>
    <div class="lista">
      @if (loading()) {
        <p class="mensaje">Loading...</p>
      } @else if (error()) {
        <p class="mensaje error">Could not load products</p>
      } @else {
        @for (product of filteredProducts(); track product.id) {
          <app-product-card [product]="product" />
        } @empty {
          <p class="mensaje">No products found</p>
        }
      }
    </div>
  </main>
</div>
