<div class="controles">
  <button class="control" type="button">Sort by ▼</button>
  <button class="control" type="button" (click)="mostrarCategoria = !mostrarCategoria">
    Filters ▼
  </button>
</div>

@if (mostrarCategoria) {
  <div class="dropdown">
    <button class="opcion" type="button"
     (click)="filter.update(f => ({ ...f, category: '' })); mostrarCategoria = false">
      All
    </button>
    @for (cat of categories(); track cat) {
      <button class="opcion" type="button"
        [class.activa]="filter().category === cat"
       (click)="filter.update(f => ({ ...f, category: cat })); mostrarCategoria = false">
        {{ cat }}
      </button>
    }
  </div>
}
