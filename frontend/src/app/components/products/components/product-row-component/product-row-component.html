<article class="product-row">
  <div class="product-row__info">
    <h3 class="product-row__name">{{ product().name }}</h3>
    @if (product().description) {
      <p class="product-row__description">{{ product().description }}</p>
    }
  </div>

  <div class="product-row__actions">
    @if (confirming()) {
      <span class="product-row__confirm-text">Delete {{ product().name }}?</span>
      <button type="button" class="product-row__btn product-row__btn--cancel" (click)="onDeleteCancel()">Cancel</button>
      <button type="button" class="product-row__btn product-row__btn--danger" (click)="onDeleteConfirm()">Delete</button>
    } @else {
      <button type="button" class="product-row__btn product-row__btn--icon"
              [attr.aria-label]="'Edit ' + product().name"
              (click)="onEdit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
      <button type="button" class="product-row__btn product-row__btn--icon product-row__btn--delete"
              [attr.aria-label]="'Delete ' + product().name"
              (click)="onDeleteRequest()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
    }
  </div>
</article>
