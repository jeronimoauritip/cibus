<div class="logout-backdrop" (click)="cancelled.emit()" role="dialog" aria-modal="true" aria-labelledby="logout-title">
  <div class="logout-card" (click)="$event.stopPropagation()">
    <h2 id="logout-title" class="logout-title">{{ message() }}</h2>
    <div class="logout-actions">
      <button type="button" class="logout-confirm-no" (click)="cancelled.emit()">No</button>
      <button type="button" class="logout-confirm-yes" (click)="confirmed.emit()">Yes</button>
    </div>
  </div>
</div>
