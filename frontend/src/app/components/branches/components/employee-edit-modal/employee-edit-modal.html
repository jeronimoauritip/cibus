<div class="modal-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
  <div class="modal-card">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="employee-summary">
        <div class="employee-avatar">
          {{ employee().firstName.charAt(0) }}{{ employee().lastName.charAt(0) }}
        </div>
        <div class="employee-info">
          <h2 id="edit-modal-title" class="employee-name">
            {{ employee().firstName }} {{ employee().lastName }}
          </h2>
          <p class="employee-detail"><span>Role:</span> {{ employee().role }}</p>
        </div>
      </div>

      <button
        type="button"
        class="btn-close"
        (click)="closed.emit()"
        aria-label="Close modal"
        title="Close"
      >
        <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    @if (errorMessage()) {
      <div class="alert-message error" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <!-- Role Change Signal Form + Delete Action -->
    <form class="form" [formRoot]="roleForm" (submit)="onSaveRole()" novalidate>
      <div class="field-group">
        <div class="field-capsule">
          <label for="roleSelect">Role</label>
          <select id="roleSelect" [formField]="roleForm.roleName" aria-label="Select employee role">
            @for (role of availableRoles(); track role) {
              <option [value]="role">{{ role }}</option>
            }
          </select>
          <span class="arrow" aria-hidden="true"></span>
        </div>
      </div>

      @if (requiresNewPin()) {
        <div class="field-group">
          <div class="field-capsule">
            <label for="newPin">PIN</label>
            <input
              id="newPin"
              type="password"
              placeholder="Enter 4-digit PIN"
              autocomplete="off"
              [formField]="roleForm.newPin"
            />
          </div>
        </div>
      }

      <div class="actions">
        <button
          type="submit"
          class="btn-save"
          [disabled]="isSavingRole() || isDeleting() || isRoleUnchanged()"
        >
          @if (isSavingRole()) {
            Saving...
          } @else {
            Save role
          }
        </button>

        <button
          type="button"
          class="btn-delete-employee"
          [disabled]="isDeleting() || isSavingRole()"
          (click)="onDeleteEmployee()"
        >
          <svg class="trash-icon" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
          <span>
            @if (isDeleting()) {
              Deleting...
            } @else {
              Delete employee
            }
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
