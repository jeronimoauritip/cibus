<app-header-component>
  New Branch
</app-header-component>
<div class="pagina">
    <!-- Contenido principal: Vista Nueva Sucursal -->
    <main class="contenido">

        <form class="formulario" (submit)="$event.preventDefault(); addBranch(nameInput.value, streetInput.value, +numberInput.value); nameInput.value=''; streetInput.value=''; numberInput.value=''">
            <!-- Nombre de la sucursal -->
            <div class="campo-capsula">
                <input #nameInput id="name" name="name" type="text"
                    placeholder="Ingresá nombre de sucursal" autocomplete="off" />
            </div>

            <!-- Calle (Figma: Ingresá calle) -->
            <div class="campo-capsula">
                <input #streetInput id="street" name="street" type="text" required
                    placeholder="Ingresá calle" autocomplete="off" />
            </div>

            <!-- Numeración (Figma: Ingresá numeración) -->
            <div class="campo-capsula">
                <input #numberInput id="number" name="number" type="number" required
                    placeholder="Ingresá numeración" autocomplete="off" />
            </div>

            <!-- Botón de acción -->
            <div class="acciones">
                <button class="btn-guardar" type="submit">
                    Guardar sucursal
                </button>
            </div>
        </form>
    </main>
</div>
