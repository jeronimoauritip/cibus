<app-header-component> New Branch </app-header-component>
<div class="page">
    <!-- Contenido principal: Vista Nueva Sucursal -->
    <main class="content">

        <form class="form" (submit)="$event.preventDefault(); addBranch(nameInput.value, streetInput.value, +numberInput.value); nameInput.value=''; streetInput.value=''; numberInput.value=''">
            <!-- Nombre de la sucursal -->
            <div class="pill-field">
                <input #nameInput id="name" name="name" type="text"
                    placeholder="Enter branch name" autocomplete="off" />
            </div>

            <!-- Street (Figma: Enter street) -->
            <div class="pill-field">
                <input #streetInput id="street" name="street" type="text" required
                    placeholder="Enter street" autocomplete="off" />
            </div>

            <!-- Number (Figma: Enter number) -->
            <div class="pill-field">
                <input #numberInput id="number" name="number" type="number" required
                    placeholder="Enter number" autocomplete="off" />
            </div>

            <!-- Action button -->
            <div class="actions">
                <button class="btn-save" type="submit">
                    Guardar sucursal
                </button>
            </div>
        </form>
    </main>
</div>
