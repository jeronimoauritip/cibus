<app-header-component>
  <button type="button" headerAction class="header-action" (click)="auth.logout()" aria-label="Log out" title="Log out">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    <span>Log out</span>
  </button>
  Manager Panel
</app-header-component>

<main class="manager-panel">
    <nav class="manager-options" aria-label="Administration">
      <a class="manager-option" [routerLink]="['/branches', branchId(), 'tables']">
        Table map
      </a>
      <a class="manager-option" [routerLink]="['/branches', branchId(), 'employees']">
        Manage your employees
      </a>
      <a class="manager-option" [routerLink]="['/manager/menu/branch', branchId()]">
        Manage your menu
      </a>
      <a class="manager-stats" routerLink="/manager/statistics">
        View statistics <span aria-hidden="true">→</span>
      </a>
    </nav>
</main>
