<app-header-component>
  <button type="button" headerAction class="logout-btn" (click)="openLogoutConfirm()" aria-label="Log out">
    <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
    <span>Log out</span>
  </button>
  Admin panel
</app-header-component>

<main class="admin-panel">
  <nav class="admin-options" aria-label="Administration">
    <a class="admin-option" routerLink="/admin/branches">
      Manage your branches
    </a>

    <a class="admin-option" routerLink="/tables">
      Manage branch tables
    </a>

    <a class="admin-option" routerLink="/admin/employees">
      Manage your employees
    </a>

    <a class="admin-option" routerLink="/admin/menu">
      Manage your products
    </a>

    <a class="admin-stats" routerLink="/admin/statistics">
    View statistics <span aria-hidden="true">→</span>
    </a>
  </nav>
</main>

@if (confirmingLogout()) {
  <div class="logout-backdrop" (click)="cancelLogout()" (keydown.escape)="cancelLogout()" role="dialog" aria-modal="true" aria-labelledby="logout-title">
    <div class="logout-card" (click)="$event.stopPropagation()">
      <h2 id="logout-title" class="logout-title">Are you sure you want to log out?</h2>
      <div class="logout-actions">
        <button type="button" class="logout-confirm-no" (click)="cancelLogout()">No</button>
        <button type="button" class="logout-confirm-yes" (click)="logout()">Yes</button>
      </div>
    </div>
  </div>
}
